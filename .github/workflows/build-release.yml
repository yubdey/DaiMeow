name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pet renderer
        run: npm run build:pet

      - name: Build EXE
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build artifacts
        run: |
          if (-not (Test-Path release)) { Write-Error "release 目录不存在"; exit 1 }
          $files = Get-ChildItem release -Filter *.exe
          if ($files.Count -eq 0) { Write-Error "未生成 EXE 文件"; exit 1 }
          Write-Host "生成的文件："
          $files | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Pack portable exe into ZIP
        run: |
          $portable = Get-ChildItem release -Filter "DaiMeow-*-portable.exe" | Select-Object -First 1
          if ($portable) {
            $zipName = "DaiMeow-${{ github.ref_name }}-Windows-x64.zip"
            Compress-Archive -Path $portable.FullName -DestinationPath "release/$zipName"
            Write-Host "打包完成：release/$zipName"
          } else {
            # fallback：打包所有 exe
            $zipName = "DaiMeow-${{ github.ref_name }}-Windows-x64.zip"
            Compress-Archive -Path "release/*.exe" -DestinationPath "release/$zipName"
          }

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: DaiMeow-build
          path: release/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DaiMeow ${{ github.ref_name }}
          files: |
            release/DaiMeow-*-Windows-x64.zip
            release/DaiMeow-Setup-*-Windows-x64.exe
            release/DaiMeow-*-Windows-x64-portable.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
