name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pet renderer
        run: npm run build:pet

      - name: Build EXE
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build artifacts
        run: |
          if (-not (Test-Path release)) { Write-Error "release 目录不存在"; exit 1 }
          $files = Get-ChildItem release -Filter *.exe
          if ($files.Count -eq 0) { Write-Error "未生成 EXE 文件"; exit 1 }
          Write-Host "生成的文件："
          $files | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      # 解压即用版：把 electron-builder 生成的 win-unpacked 目录装进一个 DaiMeow\ 壳目录再压成 zip，
      # 用户解压后直接双击 DaiMeow\DaiMeow.exe 即可（不必安装，也不用像单文件便携版那样每次启动解压到临时目录）
      - name: Pack unpacked build into ZIP (解压即用版)
        run: |
          $stage = "release/DaiMeow"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "release/win-unpacked/*" -Destination $stage -Recurse -Force
          if (-not (Test-Path "$stage/DaiMeow.exe")) { Write-Error "win-unpacked 缺少 DaiMeow.exe"; exit 1 }
          $zipName = "DaiMeow-${{ github.ref_name }}-Windows-x64-unpacked.zip"
          if (Test-Path "release/$zipName") { Remove-Item "release/$zipName" -Force }
          Compress-Archive -Path $stage -DestinationPath "release/$zipName" -CompressionLevel Optimal
          Write-Host "解压即用包完成：release/$zipName ($([math]::Round((Get-Item "release/$zipName").Length/1MB,1)) MB)"
          Write-Host "解压后目录：DaiMeow\ （里面是 DaiMeow.exe 及其依赖）"

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: DaiMeow-build
          path: |
            release/*.exe
            release/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DaiMeow ${{ github.ref_name }}
          files: |
            release/DaiMeow-*-Windows-x64-unpacked.zip
            release/DaiMeow-Setup-*-Windows-x64.exe
            release/DaiMeow-*-Windows-x64-portable.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
