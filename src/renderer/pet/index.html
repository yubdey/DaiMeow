<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>呆喵 Pet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
    }
    canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
    #speech-bubble {
      position: fixed;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.92); color: #1a2a3a;
      padding: 10px 16px; border-radius: 20px;
      font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
      font-size: 13px;
      text-align: center;
      pointer-events: none; opacity: 0; transition: opacity 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      white-space: normal; word-break: break-word;
      overflow-wrap: break-word;
    }
    #speech-bubble.show { opacity: 1; }
    #speech-bubble::after {
      content: '';
      position: absolute; bottom: -6px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid rgba(255,255,255,0.92);
    }
  </style>
</head>
<body>
  <canvas id="petCanvas"></canvas>
  <div id="speech-bubble"></div>
  <script src="live2dcubismcore.js"></script>
  <script src="pet-bundle.js"></script>
</body>
</html>
